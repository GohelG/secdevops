
name: "DevSecOps Container Security Pipeline"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: secdevops-test
  IMAGE_TAG: ${{ github.sha }}

jobs:
  security-audit:
    name: Build & Scan Container
    runs-on: ubuntu-latest

    steps:
      # Sprint 1: Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Configure Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Sprint 1: Build local Docker image
      - name: Build Local Test Image
        run: |
          docker build \
            -f dockerfiles/Dockerfile.malicious \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            .

      # Verify Docker image
      - name: Verify Docker Image
        run: |
          docker images
          docker image inspect "${IMAGE_NAME}:${IMAGE_TAG}" > /dev/null

      # Sprint 1 & 2: Vulnerability scanning
      # Fail pipeline on fixable HIGH or CRITICAL vulnerabilities
      - name: Run Trivy Security Scan
        id: trivy-scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          format: 'table'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          trivyignores: 'scanner/.trivyignore'

      # Sprint 3: Generate JSON vulnerability report
      - name: Generate Structured Vulnerability Report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          format: 'json'
          output: 'vulnerability-report.json'
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'

      # Sprint 3: Upload vulnerability report
      - name: Upload Vulnerability Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-report-${{ github.sha }}
          path: vulnerability-report.json
          retention-days: 30
          if-no-files-found: warn

      # Sprint 3: Slack notification
      - name: Send Slack Notification
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          SCAN_STATUS: ${{ steps.trivy-scan.outcome }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "Slack webhook not configured"
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          status = os.environ["JOB_STATUS"]

          icons = {
              "success": ":white_check_mark:",
              "failure": ":x:",
              "cancelled": ":warning:"
          }

          icon = icons.get(status, ":information_source:")

          message = (
              f"{icon} *DevSecOps Container Security Pipeline*\n"
              f"*Pipeline Status:* {status.upper()}\n"
              f"*Scan Status:* {os.environ['SCAN_STATUS']}\n"
              f"*Repository:* {os.environ['REPOSITORY']}\n"
              f"*Branch:* {os.environ['BRANCH']}\n"
              f"*Commit:* {os.environ['COMMIT_SHA'][:7]}\n"
              f"*Workflow:* <{os.environ['RUN_URL']}|View GitHub Actions Run>"
          )

          payload = json.dumps({
              "text": message
          }).encode("utf-8")

          request = urllib.request.Request(
              os.environ["SLACK_WEBHOOK_URL"],
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          with urllib.request.urlopen(request, timeout=15) as response:
              print("Slack HTTP status:", response.status)
          PY
