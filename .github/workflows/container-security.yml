
name: DevSecOps Vulnerability Scan Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1-5'

permissions:
  contents: read

env:
  IMAGE_NAME: secdevops-test
  SEVERITY_THRESHOLD: HIGH,CRITICAL
  REPORT_FILE: reporting/scan_report.json

jobs:
  build-and-scan:
    name: Build, Scan, Report and Notify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare reporting directory
        run: mkdir -p reporting

      - name: Build test Docker image
        run: |
          docker build \
            -f dockerfiles/Dockerfile.malicious \
            -t "${IMAGE_NAME}:${GITHUB_SHA}" \
            .

      - name: Generate Trivy JSON report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: secdevops-test:${{ github.sha }}
          scan-type: image
          format: json
          output: reporting/scan_report.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'

      - name: Verify Trivy report
        run: |
          test -s "$REPORT_FILE"
          python3 -m json.tool "$REPORT_FILE" > /dev/null

      - name: Generate HTML report
        if: success()
        run: |
          python3 reporting/generate_report.py \
            reporting/scan_report.json

      - name: Upload vulnerability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-report-${{ github.run_id }}
          path: |
            reporting/*.json
            reporting/*.html
            reporting/*.pdf
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce vulnerability policy
        if: success()
        run: |
          bash scanner/policy/check_policy.sh \
            reporting/scan_report.json

      - name: Send Slack notification
        if: always() && github.event_name != 'pull_request'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          webhook = os.environ.get("SLACK_WEBHOOK_URL")

          if not webhook:
              print("Slack webhook not configured; skipping.")
              raise SystemExit(0)

          status = os.environ["JOB_STATUS"]
          emoji = ":white_check_mark:" if status == "success" else ":x:"

          payload = {
              "text": (
                  f"{emoji} *SecDevOps Scan: {status.upper()}*\n"
                  f"*Repository:* GohelG/secdevops\n"
                  f"*Workflow:* {os.environ['RUN_URL']}"
              )
          }

          request = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(request, timeout=15) as response:
              print("Slack notification status:", response.status)
          PY

