name: DevSecOps Vulnerability Scan Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1-5'

permissions:
  contents: read

concurrency:
  group: container-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-scan:
    name: Build, Scan All Local Images, Report and Notify
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: secdevops-test
      SEVERITY_THRESHOLD: HIGH,CRITICAL
      REPORT_DIR: reporting/runs/${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update && sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://github.io | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://github.io $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Prepare Report Directory
        run: mkdir -p "${{ env.REPORT_DIR }}"

      - name: Check prerequisites
        run: |
          docker info >/dev/null
          trivy --version
          python3 --version

      - name: Build new test image
        run: |
          docker build -f dockerfiles/Dockerfile.malicious -t "${IMAGE_NAME}:${GITHUB_SHA}" .

      - name: Scan new image first, then every other local image
        id: scan
        continue-on-error: true
        env:
          NEW_IMAGE: secdevops-test:${{ github.sha }}
        run: bash scanner/scripts/scan.sh

      - name: Enforce JSON policy on every image
        id: policy
        if: steps.scan.outcome == 'success'
        continue-on-error: true
        run: bash scanner/policy/check_policy.sh "$REPORT_DIR"

      - name: Upload scan reports and policy summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: ignore
          retention-days: 30

      - name: Send Slack notification
        if: always() && github.event_name != 'pull_request'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          url=os.getenv('SLACK_WEBHOOK_URL')
          if not url:
              print('Slack webhook not configured; skipping')
          else:
              payload={'text':f"SecDevOps scan: {os.environ['SCAN_OUTCOME']} | policy: {os.environ['POLICY_OUTCOME']} | {os.environ['RUN_URL']}"}
              request=urllib.request.Request(url,data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request,timeout=15) as response: print('Slack HTTP',response.status)
          PY

      - name: Fail job if scan or policy failed
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
        run: |
          if [ "$SCAN_OUTCOME" != "success" ] || [ "$POLICY_OUTCOME" != "success" ]; then
            echo "Critical: Security scan or policy verification failed!"
            exit 1
          fi

