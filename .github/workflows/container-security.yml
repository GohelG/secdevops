name: DevSecOps Vulnerability Scan Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1-5'

permissions:
  contents: read

env:
  IMAGE_NAME: my-app
  SEVERITY_THRESHOLD: HIGH,CRITICAL

jobs:
  build-and-scan:
    name: Build, Scan, Report and Notify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run unit tests
        run: python -m pytest tests/ -v

      - name: Build Docker image
        run: |
          docker build \
            -t "${IMAGE_NAME}:${GITHUB_SHA}" \
            .

          docker tag \
            "${IMAGE_NAME}:${GITHUB_SHA}" \
            "${IMAGE_NAME}:latest"

      - name: Generate Trivy JSON report
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: my-app:${{ github.sha }}
          format: json
          output: reports/trivy.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'

      - name: Generate HTML and PDF reports
        if: always()
        run: |
          if test -s reports/trivy.json; then
            python reporting/generate_report.py \
              reports/trivy.json \
              --outdir reports
          fi

      - name: Upload vulnerability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-report-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce vulnerability policy
        if: success()
        env:
          IMAGE: my-app:${{ github.sha }}
        run: |
          python scanner/policy.py \
            reports/trivy.json \
            --image "$IMAGE" \
            --exceptions scanner/exceptions.yaml

      - name: Send Slack notification
        if: always() && github.event_name != 'pull_request'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python notifications/slack_notify.py \
            --status "$JOB_STATUS" \
            --url "$RUN_URL"
